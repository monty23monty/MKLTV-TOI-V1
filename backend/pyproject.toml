[project]
name = "lightning-toi"
version = "2.0.0"
requires-python = ">=3.12"
description = "Lightning TV authoritative live time-on-ice service"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
