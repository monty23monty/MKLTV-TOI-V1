name: Container stack smoke test

on:
  push:
    branches: [codex/ipad-operator]
    paths:
      - '.github/workflows/container-smoke.yml'
      - 'Dockerfile.*'
      - '.dockerignore'
      - 'compose*.yaml'
      - 'nginx.conf'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/start-backend.sh'
      - 'scripts/smoke_portainer.py'
      - 'scripts/smoke_service_stream.py'
      - 'VERSION'
  pull_request:
    paths:
      - '.github/workflows/container-smoke.yml'
      - 'Dockerfile.*'
      - '.dockerignore'
      - 'compose*.yaml'
      - 'nginx.conf'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/start-backend.sh'
      - 'scripts/smoke_portainer.py'
      - 'scripts/smoke_service_stream.py'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: mkltoi-ci
      TOI_IMAGE_TAG: ci
      TOI_BIND_ADDRESS: 127.0.0.1
      TOI_FRONTEND_PORT: '18080'
      POSTGRES_DB: lightning_toi
      POSTGRES_USER: toi
      POSTGRES_PASSWORD: 'ci-db@pass:/?#%$'
      TOI_AUTH_TOKEN: ci-operator-token
      TOI_CORS_ORIGINS: http://127.0.0.1:18080
      TOI_STREAM_ENABLED: 'true'
      TOI_SERVICE_TOKENS: '{"ci-service-token":{"service_id":"ci-service","game_ids":["*"],"permissions":["stream:read","journal:read","players:write","clock:write","clock:control","clock:authority","history:write","setup:write"],"team_ids":null,"clock_sources":["ci-scoreboard"],"expires_at_ms":null}}'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Mask test credentials
        run: |
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$TOI_AUTH_TOKEN"
          echo "::add-mask::ci-service-token"
          echo "::add-mask::$TOI_SERVICE_TOKENS"
      - name: Build Linux images
        run: |
          docker build -f Dockerfile.backend -t mkltoi-backend:ci .
          docker build -f Dockerfile.frontend -t mkltoi-frontend:ci .
      - name: Validate and start image-only Portainer stack
        run: |
          docker compose -f compose.portainer.yaml config --quiet
          docker compose -f compose.portainer.yaml up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:18080/health
      - name: Exercise nginx, authentication, live changes and Undo
        id: smoke
        run: |
          result=$(docker compose -f compose.portainer.yaml exec -T backend python - --origin "$TOI_CORS_ORIGINS" < scripts/smoke_portainer.py)
          echo "$result"
          echo "game_id=$(echo "$result" | jq -er '.game_id')" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(echo "$result" | jq -er '.fingerprint')" >> "$GITHUB_OUTPUT"
      - name: Exercise v2 clock ownership, journal and duplex WebSocket
        id: service_smoke
        run: |
          result=$(docker compose -f compose.portainer.yaml exec -T backend python - \
            --origin "$TOI_CORS_ORIGINS" < scripts/smoke_service_stream.py)
          echo "$result"
          echo "game_id=$(echo "$result" | jq -er '.game_id')" >> "$GITHUB_OUTPUT"
          echo "cursor=$(echo "$result" | jq -er '.cursor')" >> "$GITHUB_OUTPUT"
      - name: Recreate containers while preserving PostgreSQL volume
        run: |
          docker compose -f compose.portainer.yaml down
          docker compose -f compose.portainer.yaml up -d --wait --wait-timeout 180
      - name: Verify game, TOI and history survived recreation
        env:
          SMOKE_GAME_ID: ${{ steps.smoke.outputs.game_id }}
          SMOKE_FINGERPRINT: ${{ steps.smoke.outputs.fingerprint }}
          SERVICE_GAME_ID: ${{ steps.service_smoke.outputs.game_id }}
          SERVICE_CURSOR: ${{ steps.service_smoke.outputs.cursor }}
        run: |
          docker compose -f compose.portainer.yaml exec -T backend python - \
            --origin "$TOI_CORS_ORIGINS" --verify-game "$SMOKE_GAME_ID" \
            --fingerprint "$SMOKE_FINGERPRINT" < scripts/smoke_portainer.py
          docker compose -f compose.portainer.yaml exec -T backend python - \
            --origin "$TOI_CORS_ORIGINS" --verify-game "$SERVICE_GAME_ID" \
            --cursor "$SERVICE_CURSOR" < scripts/smoke_service_stream.py
      - name: Collect diagnostics after failure
        if: failure()
        run: |
          docker compose -f compose.portainer.yaml ps --all
          docker compose -f compose.portainer.yaml logs --no-color --tail=150
      - name: Remove ephemeral CI containers and volume
        if: always()
        run: docker compose -f compose.portainer.yaml down --volumes --remove-orphans
